<form [formGroup]="form" (ngSubmit)="submit()" class="p-3">

    <div class="mb-3">
      <label for="name" class="form-label">Name:</label>
      <input id="name" type="text" class="form-control"
             formControlName="name"
             [value]="form.value.name | removeNumbers">
    </div>
  
    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name:</label>
      <input id="lastName" type="text" class="form-control"
             formControlName="lastName">
    </div>
  
    <div class="mb-3">
      <label for="mobile" class="form-label">Mobile:</label>
      <input id="mobile" type="text" class="form-control"
             formControlName="mobile" placeholder="10 digits">
    </div>
  
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input id="email" type="email" class="form-control"
             formControlName="email" placeholder="example@gmail.com">
    </div>
  
    <div class="mb-3">
      <label for="birthday" class="form-label">Birthday (DD/MM/YYYY):</label>
      <input id="birthday" type="text" class="form-control"
             formControlName="birthday" placeholder="DD/MM/YYYY">
    </div>
  
    <div class="row">
      <!-- available options -->
      <div class="col-md-6">
        <label class="form-label">Options</label>
        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              *ngFor="let option of options"
              (click)="selectOption(option)"
              appLimitSelection
              [selectedItems]="selected"
              [limit]="3"
              style="cursor: pointer;">
            {{option}}
          </li>
        </ul>
      </div>
    
      <!-- selected list -->
      <div class="col-md-6">
        <label class="form-label">Selected</label>
        <ul class="list-group mt-0">
          <li class="list-group-item list-group-item-success d-flex justify-content-between align-items-center"
              *ngFor="let sel of selected">
            {{sel}}
            <span class="text-danger" style="cursor:pointer"
                  (click)="removeOption(sel)">✖</span>
          </li>
        </ul>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Submit</button>
  </form>
